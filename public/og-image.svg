<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1f4e"/>
      <stop offset="50%" style="stop-color:#2D4DE0"/>
      <stop offset="100%" style="stop-color:#1E3BB3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#3b5be0" opacity="0.15"/>
  <circle cx="1100" cy="530" r="250" fill="#6366f1" opacity="0.1"/>
  <circle cx="800" cy="80" r="150" fill="#818cf8" opacity="0.08"/>
  
  <!-- Logo icon -->
  <rect x="520" y="140" width="60" height="60" rx="14" fill="url(#accent)"/>
  <text x="550" y="183" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" font-weight="bold">S</text>
  
  <!-- Brand name -->
  <text x="600" y="280" font-family="Arial, Helvetica, sans-serif" font-size="72" fill="white" text-anchor="middle" font-weight="900" letter-spacing="-2">StudentOS</text>
  
  <!-- Tagline -->
  <text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#93c5fd" text-anchor="middle" font-weight="500">Build Your Career While You Study</text>
  
  <!-- Divider line -->
  <rect x="450" y="370" width="300" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
  
  <!-- Feature pills -->
  <rect x="200" y="410" width="160" height="40" rx="20" fill="white" opacity="0.12"/>
  <text x="280" y="436" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">🎓 Scholarships</text>
  
  <rect x="390" y="410" width="130" height="40" rx="20" fill="white" opacity="0.12"/>
  <text x="455" y="436" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">📄 CV Checker</text>
  
  <rect x="550" y="410" width="120" height="40" rx="20" fill="white" opacity="0.12"/>
  <text x="610" y="436" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">💼 Job Finder</text>
  
  <rect x="700" y="410" width="150" height="40" rx="20" fill="white" opacity="0.12"/>
  <text x="775" y="436" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">📅 Habit Tracker</text>
  
  <rect x="880" y="410" width="140" height="40" rx="20" fill="white" opacity="0.12"/>
  <text x="950" y="436" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">🔍 Plagiarism</text>
  
  <!-- CTA -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="18" fill="#93c5fd" text-anchor="middle" opacity="0.8">AI-Powered Platform · 10+ Tools · Free Trial</text>
  
  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" opacity="0.4">studentos.uz</text>
</svg>
